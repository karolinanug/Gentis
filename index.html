<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genties susitikimas</title>
  <meta name="theme-color" content="#b5654a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gentis" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="auth" class="auth" hidden></main>

  <main id="app" hidden>
    <header class="top">
      <div class="top-row">
        <h1>Genties susitikimas</h1>
        <div class="userbar" id="userbar"></div>
      </div>
      <div id="link-google"></div>
      <a href="#kalendorius" class="next-banner" id="next-banner" hidden></a>
      <nav class="tabs">
        <a href="#scenarijus" data-tab="scenarijus">Scenarijus</a>
        <a href="#archyvas" data-tab="archyvas">Archyvas</a>
        <a href="#kalendorius" data-tab="kalendorius">Kalendorius</a>
      </nav>
    </header>

    <section id="tab-scenarijus" class="tab">
      <form class="card" id="form">
        <div class="field">
          <span class="label">Formatas</span>
          <div class="chips" id="kinds"></div>
        </div>
        <div class="field">
          <div class="label-row">
            <label for="topic">Tema</label>
            <button type="button" class="link" id="suggest">Pasiūlyk temų</button>
          </div>
          <input type="text" id="topic" maxlength="120" placeholder="pvz., Draugystė, Vaikystės vasaros, Drąsa" required />
          <p class="hint" id="topic-note" hidden></p>
          <div class="suggestions" id="suggestions" hidden></div>
        </div>
        <div class="field">
          <span class="label">Tonas</span>
          <div class="chips" id="depths"></div>
        </div>
        <div class="field">
          <span class="label" id="count-label">Pagrindinių klausimų skaičius</span>
          <div class="chips" id="counts"></div>
        </div>
        <div class="field" id="code-field">
          <label for="code">Genties kodas</label>
          <input type="password" id="code" autocomplete="current-password" />
        </div>
        <button class="primary" id="go" type="submit">Kurti scenarijų</button>
        <p class="error" id="error" hidden></p>
      </form>
      <div id="result"></div>
    </section>

    <section id="tab-archyvas" class="tab" hidden></section>
    <section id="tab-kalendorius" class="tab" hidden></section>

    <footer class="site-foot">
      <a href="pagalba.html">Kaip naudotis?</a> ·
      <a href="privacy.html">Privatumo politika</a> ·
      <button type="button" class="link danger" id="delete-account">Ištrinti paskyrą</button>
    </footer>
  </main>

  <div id="host" class="host" hidden></div>

  <script src="app.js"></script>
</body>
</html>
